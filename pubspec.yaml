name: money_ledger
description: Decentralized expense sharing app using the Matrix network.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # Localization (G12): EN + DE via ARB files in lib/l10n (see l10n.yaml)
  flutter_localizations:
    sdk: flutter
  intl: any
  # About page: app version (BSD-3-Clause)
  package_info_plus: ^9.0.1
  cupertino_icons: ^1.0.8
  # Matrix protocol
  matrix: ^7.2.2
  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  # Local database — drift 2.31 + drift_flutter 0.2.8 share sqlite3 ^2.x with
  # the matrix SDK, eliminating the version conflict and any dependency_overrides.
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  sqlite3_flutter_libs: ^0.5.0
  # sqflite for matrix SDK internal storage
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  # Navigation
  go_router: ^17.2.3
  # Web platform utilities (URL navigation for SSO)
  web: ^1.1.0
  # Native SSO: open the system browser and receive the moneyledger:// callback
  url_launcher: ^6.3.0
  app_links: ^6.3.0
  # CSV backup: pick a file to import / save the exported sheet (web + native)
  file_picker: ^8.1.2
  # Utilities
  uuid: ^4.5.3
  # E2EE (vodozemac via Rust/flutter_rust_bridge). >=0.6.0 is required for
  # Android: it fixes Gradle 9 (Project.exec removed) and compiles against SDK 36.
  # Android builds need a Rust toolchain (rustup, stable) — see README.
  flutter_vodozemac: ^0.6.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.31.0
  riverpod_generator: ^4.0.3
  sqlite3: ^2.7.4

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations*.dart from the ARB files on
  # `flutter pub get` / build (the generated files are also committed).
  generate: true
