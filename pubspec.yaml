name: money_ledger
description: Decentralized expense sharing app using the Matrix network.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # Localization (G12): EN + DE via ARB files in lib/l10n (see l10n.yaml)
  flutter_localizations:
    sdk: flutter
  intl: any
  # About page: app version (BSD-3-Clause)
  package_info_plus: ^10.2.2
  cupertino_icons: ^2.0.0
  # Matrix protocol
  matrix: ^14.0.0
  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  # Local database — drift 2.35 + drift_flutter 0.3 share sqlite3 3.x with the
  # matrix SDK (G22: upgrade them together), no dependency_overrides needed.
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  # sqflite for matrix SDK internal storage
  sqflite: ^2.4.4
  path_provider: ^2.1.6
  # Navigation
  go_router: ^18.1.0
  # Web platform utilities (URL navigation for SSO)
  web: ^1.1.0
  # Native SSO: open the system browser and receive the moneyledger:// callback
  url_launcher: ^6.3.3
  app_links: ^7.2.2
  # CSV backup: pick a file to import / save the exported sheet (web + native)
  file_picker: ^13.1.0
  # Utilities
  uuid: ^4.6.0
  # E2EE (vodozemac via Rust/flutter_rust_bridge). >=0.6.0 is required for
  # Android: it fixes Gradle 9 (Project.exec removed) and compiles against SDK 36.
  # Android builds need a Rust toolchain (rustup, stable) — see README.
  flutter_vodozemac: ^0.8.1
  # G6 signed records: Ed25519 verify (vodozemac, AGPL — already pulled in by
  # matrix), Matrix canonical JSON (Apache-2.0) + SHA-256 (BSD-3) for the
  # signed record bodies. All three were transitive deps already.
  vodozemac: ^0.8.0
  canonical_json: ^1.1.3
  crypto: ^3.0.7
  workmanager: ^0.10.10
  # G36: request (header) timeout for the Matrix client — already transitive
  # via matrix (BSD-3-Clause).
  http: ^1.6.0
  cryptography: ^2.9.0
  # G52 link groups: gzip of the snapshot before AES-GCM — pure Dart on the
  # web (dart:io zlib natively). Already transitive (MIT; pulls in `posix`,
  # MIT).
  archive: ^4.0.9
  # G52 step 2: mini Nostr client — BIP-340 Schnorr sign / verify (MIT,
  # fiatjaf) on secp256k1 from pointycastle (MIT, Bouncy Castle); relay
  # WebSockets on native + web (BSD-3, dart.dev; was transitive via matrix).
  bip340: ^0.3.1
  pointycastle: ^4.0.0
  web_socket_channel: ^3.0.3
  # G69: system share sheet ("who pays whom" as text; G52's invite sheet)
  # — BSD-3-Clause, no Google services (F-Droid ok).
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.1
  riverpod_generator: ^4.0.9
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations*.dart from the ARB files on
  # `flutter pub get` / build (the generated files are also committed).
  generate: true
  # G17: brand assets (logo PNG rendered by tool/brand/render_icons.py).
  assets:
    - assets/brand/logo_512.png
    # G43: the web fetches no font from Google, so it brings its own
    # fallbacks (tool/fonts/make_web_fonts.py): the 64 SAS verification emoji
    # (Noto Color Emoji subset, OFL-1.1) and symbols Roboto lacks (DejaVu Sans
    # subset). Registered at runtime by loadWebOnlyFonts(); web only — Android
    # uses its system fonts.
    - path: assets/fonts/sas_emoji/NotoColorEmoji-SAS.ttf
      platforms: [web]
    - path: assets/fonts/sas_emoji/OFL.txt
      platforms: [web]
    - path: assets/fonts/symbols/DejaVuSans-Symbols.ttf
      platforms: [web]
    - path: assets/fonts/symbols/LICENSE.txt
      platforms: [web]
  # G42: no bundled fonts — the platform's own font (Roboto on Android). G43:
  # the web engine's default Roboto is served from web/fonts/ (see
  # web/flutter_bootstrap.js), not declared here, so Android is untouched.
