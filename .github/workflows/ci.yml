# CI (G15): codegen freshness, formatting, analysis, the full offline test
# suite and the web release build — the same gates as ./build.sh.
#
# The `android` job builds the signed release: split APKs per ABI and the App
# Bundle (AAB) for Google Play, kept as an artifact for 30 days. On a tag
# v<version> it also publishes a GitHub release with the APKs as
# MoneyLedger-<version>-<abi>.apk. flutter_vodozemac compiles the vodozemac
# Rust crate via cargokit, so the job installs rustup's Android targets; the
# runner's Android SDK brings the NDK.
#
# Three repository secrets make the release build the installable one:
#   ANDROID_KEYSTORE_BASE64    <- ~/moneyledger-upload-keystore.jks, base64
#   ANDROID_KEYSTORE_PASSWORD  <- android/key.properties (storePassword)
#   ANDROID_KEY_PASSWORD       <- android/key.properties (keyPassword)
# The alias `upload` is a literal, not a secret: GitHub masks every occurrence
# of a secret's value in the log. Without the secrets (a fork's pull request)
# the release build falls back to the debug key and is only a smoke test.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # v2 is still the latest major (composite action; its caching uses
      # actions/cache@v5, i.e. Node 24).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in sync with the local toolchain (`flutter --version`).
          flutter-version: 3.44.0
          # Caches the Flutter SDK and the pub cache between runs.
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation (Drift + Riverpod)
        run: dart run build_runner build

      - name: Generated code is up to date
        # pub get also regenerates lib/l10n/app_localizations*.dart.
        run: git diff --exit-code

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test --reporter compact

      - name: Web release build (no CDN — G43)
        run: flutter build web --release --no-web-resources-cdn

      - name: Web build loads nothing from a CDN
        run: tool/web/check_web_build.sh build/web

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Write access only to publish the release on a tag.
    permissions:
      contents: write
    # The `secrets` context cannot be read in a step's `if:`; an env var can.
    env:
      HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Rust targets for flutter_vodozemac (cargokit)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Version
        run: |
          v="$(sed -n 's/^version: *//p' pubspec.yaml)"
          echo "VERSION_NAME=${v%%+*}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${v##*+}" >> "$GITHUB_ENV"
          echo "version $v"

      # A release tag must name the version it ships, and come with notes.
      - name: Release tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]; then
            echo "!!! tag $GITHUB_REF_NAME does not match pubspec version $VERSION_NAME" >&2
            exit 1
          fi
          notes="fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
          if [ ! -s "$notes" ]; then echo "!!! $notes is missing or empty" >&2; exit 1; fi

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Materialise what android/app/build.gradle.kts reads; storeFile resolves
      # relative to android/app. Both files are gitignored and live only here.
      - name: Release signing
        if: env.HAVE_KEYSTORE != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=upload"
          } > android/key.properties

      # Only split APKs, never a universal one: Flutter numbers each split
      # abi * 1000 + versionCode, so a universal APK would look like a downgrade.
      - name: Release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64

      - name: App Bundle (AAB) for Google Play
        run: flutter build appbundle --release

      - name: Signed with the upload key, not debug
        if: env.HAVE_KEYSTORE != ''
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            desc="$("$apksigner" verify --print-certs "$apk")"
            echo "$apk"; echo "$desc" | grep -E 'DN:|SHA-256' || true
            if [ -z "$desc" ]; then echo "!!! $apk has no signing certificate" >&2; exit 1; fi
            if echo "$desc" | grep -q 'CN=Android Debug'; then echo "!!! $apk signed with the debug key" >&2; exit 1; fi
          done
          aab=build/app/outputs/bundle/release/app-release.aab
          cert="$(keytool -printcert -jarfile "$aab")"
          echo "$cert" | grep -E 'Owner:|SHA256:' || true
          if [ -z "$cert" ] || echo "$cert" | grep -q 'Not a signed jar'; then echo "!!! bundle not signed" >&2; exit 1; fi
          if echo "$cert" | grep -q 'CN=Android Debug'; then echo "!!! bundle signed with the debug key" >&2; exit 1; fi

      - name: Name the builds after their version
        if: env.HAVE_KEYSTORE != ''
        run: |
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/MoneyLedger-$VERSION_NAME-$abi.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab "dist/MoneyLedger-$VERSION_NAME-$VERSION_CODE.aab"

      - name: Keep the signed build
        if: env.HAVE_KEYSTORE != ''
        uses: actions/upload-artifact@v4
        with:
          name: moneyledger-release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # Only the APKs go into the release; the AAB stays in the artifact for Play.
      - name: Publish the GitHub release
        if: env.HAVE_KEYSTORE != '' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "MoneyLedger $VERSION_NAME" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt" \
            --verify-tag

      - name: Remove the key
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
